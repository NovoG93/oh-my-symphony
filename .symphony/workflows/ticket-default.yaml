# Governed workflow: the conservative default from PRD §29.
#
# This file is executable code. It can start agents and run shell commands
# in the ticket workspace, so review changes to it the way you would review
# a CI pipeline change.
#
# Sequence: plan -> human approval -> implement -> tests -> review ->
#           human approval -> prepare PR.
#
# Deliberately linear. Parallel reviewers, loops, and sub-workflows come
# after the event ledger, gates, and crash recovery have been proven on
# real runs.

version: 1
name: ticket-default
description: Plan, get approval, implement, validate, review, and prepare a PR.

defaults:
  backend: inherit
  context: fresh
  timeout_seconds: 1800
  max_parallel_nodes: 1

nodes:
  - id: plan
    type: agent
    workspace_access: read
    output_type: plan
    prompt_file: docs/symphony-prompts/workflows/plan.md

  - id: approve-plan
    type: approval
    depends_on: [plan]
    title: Approve the implementation plan
    instructions: >-
      Check that the plan addresses the ticket, names the files it will
      touch, and states how it will be verified. Reject if it proposes
      work outside the ticket's scope.
    evidence: [plan]

  - id: implement
    type: agent
    depends_on: [approve-plan]
    workspace_access: write
    prompt: |
      Implement the approved plan for ${ticket.identifier}.

      Ticket title: ${ticket.title}

      Approved plan:
      ${nodes.plan.output}

      Make the smallest change that satisfies the plan. Do not edit the
      ticket's `state` field — the orchestrator owns board transitions for
      governed runs.

  - id: test
    type: shell
    depends_on: [implement]
    workspace_access: write
    run: python -m pytest -q
    timeout_seconds: 1800

  - id: review
    type: agent
    depends_on: [test]
    workspace_access: read
    output_type: review
    prompt_file: docs/symphony-prompts/workflows/review.md

  - id: release-approval
    type: approval
    depends_on: [review]
    title: Approve pull-request preparation
    instructions: >-
      The diff and the test result below are deterministic; the review text
      is a model's judgement. Approving makes the PR-creating node eligible.
    evidence: [test, review]

  - id: finalize
    type: agent
    depends_on: [release-approval]
    workspace_access: write
    external_side_effects: true
    prompt_file: docs/symphony-prompts/workflows/finalize-pr.md
