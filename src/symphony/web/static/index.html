<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oh-my-symphony</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="board-name" id="board-name" data-i18n="common.loading">Loading&hellip;</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="nav-item" data-route="board" href="#/board">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="3.4" height="11" rx="1"/><rect x="6.3" y="2.5" width="3.4" height="7" rx="1"/><rect x="11.1" y="2.5" width="3.4" height="9" rx="1"/></svg>
          <span class="nav-label" data-i18n="nav.board">Board</span>
        </a>
        <a class="nav-item" data-route="stats" href="#/stats">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 13.5V9"/><path d="M6.2 13.5V5"/><path d="M10.4 13.5V7.5"/><path d="M14.6 13.5V2.5"/></svg>
          <span class="nav-label" data-i18n="nav.stats">Stats</span>
        </a>
        <a class="nav-item" data-route="workflow" href="#/workflow">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="3.2" r="1.6"/><circle cx="4" cy="12.8" r="1.6"/><circle cx="12" cy="8" r="1.6"/><path d="M4 4.8v6.4"/><path d="M5.4 8H10.4"/></svg>
          <span class="nav-label" data-i18n="nav.workflow">Workflow</span>
        </a>
        <a class="nav-item" data-route="git" href="#/git">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.5" r="1.7"/><circle cx="4.5" cy="12.5" r="1.7"/><circle cx="11.5" cy="5.5" r="1.7"/><path d="M4.5 5.2v5.6"/><path d="M11.5 7.2c0 2.3-2.5 2.8-4.5 3"/></svg>
          <span class="nav-label" data-i18n="nav.git">Git</span>
        </a>
        <a class="nav-item" data-route="chat" href="#/chat">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10.5a1.5 1.5 0 0 1-1.5 1.5H8l-3 2.5V12H3.5A1.5 1.5 0 0 1 2 10.5v-6A1.5 1.5 0 0 1 3.5 3h9A1.5 1.5 0 0 1 14 4.5z"/></svg>
          <span class="nav-label" data-i18n="nav.chat">Chat</span>
        </a>
        <a class="nav-item" data-route="preview" href="#/preview" aria-label="Product Preview">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.2"/><path d="M5.5 14h5M8 11.5V14"/><path d="m6.4 5.3 3.6 1.7-3.6 1.7z"/></svg>
          <span class="nav-label" data-i18n="nav.preview">Preview</span>
        </a>
        <a class="nav-item" data-route="settings" href="#/settings">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.3 3.7l-1.1 1.1M4.8 11.2l-1.1 1.1M12.3 12.3l-1.1-1.1M4.8 4.8 3.7 3.7"/></svg>
          <span class="nav-label" data-i18n="nav.settings">Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-text" data-i18n="conn.connecting">Connecting&hellip;</span>
      </div>
    </aside>
    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast-container" class="toast-container"></div>
  <div id="overlay-root"></div>
  <!-- i18n must define window.i18n before app.js runs. -->
  <script src="/static/i18n.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
